<!doctype html>
<html>
  <head>
    <title>Randomly build a graph (ES6 Module Version)</title>
    <meta charset="UTF-8" />

    <script type="importmap" src="import-map.json"></script>

    <!-- Make d3 available globally for webcola -->
    <script type="module">
      import * as d3 from 'd3';
      window.d3 = d3;
    </script>

    <link rel="stylesheet" type="text/css" href="css/dc.graph.css" />
    <link rel="stylesheet" type="text/css" href="css/dc.css" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link rel="stylesheet" type="text/css" href="css/fontawesome-all.css" />
    <link rel="stylesheet" type="text/css" href="css/example-common.css" />

    <!-- Layout engine dependencies -->
    <script type="text/javascript" src="js/cola.js"></script>
    <script type="text/javascript" src="js/dagre.js"></script>
    <script type="module" src="js/parse-incrface.js"></script>
    <script type="module" src="js/dynagraph-main.js"></script>

    <script type="text/javascript" src="js/chart.registry.js"></script>
    <script type="text/javascript" src="js/jquery.js"></script>

    <style type="text/css">
      body {
        overflow: hidden;
        margin: 0;
      }
      #main {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
      }
      #controls {
        padding: 10px;
      }
      #play-stop {
        font-size: 3em;
        width: 50px;
        padding-left: 10px;
      }
      select {
        top: -0.6em;
      }
      #graph {
        flex: 1;
      }
    </style>
  </head>

  <body>
    <div id="main">
      <script type="module" src="js/example-header.js"></script>
      <div id="controls">
        <i id="play-stop" class="fas fa-pause"></i>
        &emsp;&emsp;
        <select id="layout"></select>
      </div>
      <div id="graph" class="chart"></div>
    </div>

    <!-- ES6 Module Script -->
    <script type="module" src="js/random.js"></script>
  </body>
</html>
