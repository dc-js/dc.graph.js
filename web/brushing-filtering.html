<!doctype html>
<html>
  <head>
    <title>Brushing and filtering</title>
    <meta charset="UTF-8" />

    <!-- Import maps MUST be before any ES6 modules -->
    <script type="importmap" src="import-map.json"></script>

    <!-- Make d3 available globally for webcola -->
    <script type="module">
      import * as d3 from 'd3';
      window.d3 = d3;
    </script>

    <link rel="stylesheet" type="text/css" href="css/dc.graph.css" />
    <link rel="stylesheet" type="text/css" href="css/graph-controls.css" />
    <link rel="stylesheet" type="text/css" href="css/graph-error.css" />
    <link rel="stylesheet" type="text/css" href="css/dc.css" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link rel="stylesheet" type="text/css" href="css/brushing-filtering.css" />

    <!-- Layout engines and external libraries loaded as globals for now -->
    <script type="text/javascript" src="js/cola.js"></script>
    <script type="text/javascript" src="js/dagre.js"></script>
    <script type="module" src="js/parse-incrface.js"></script>
    <script type="module" src="js/dynagraph-main.js"></script>

    <script type="module" src="js/graph-error.js"></script>
    <script type="text/javascript" src="js/chart.registry.js"></script>

    <script type="text/javascript" src="js/jquery.js"></script>
  </head>

  <body>
    <div id="main">
      <script type="module" src="js/example-header.js"></script>
      <div id="controls">
        <div id="left-controls">
          <select id="layout"></select>
          <select id="number"></select>
        </div>
        <div id="middle-controls"></div>
        <div id="right-controls">
          <label for="#user-file" title="in-browser: nothing uploaded to server">
            Load file&nbsp;
          </label>
          <input
            type="file"
            id="user-file"
            style="display: inline"
            title="in-browser: nothing uploaded to server"
          />
          <a id="data-link" target="dcgraph-datalink" style="font-size: 8px" href="#">DATA LINK</a>
        </div>
      </div>
      <div id="content">
        <div id="graph"></div>
        <div id="charts">
          <div id="pie"></div>
          <div id="row"></div>
        </div>
      </div>
    </div>
    <div id="message" style="display: none"></div>
    <script type="module" src="js/brushing-filtering.js"></script>
  </body>
</html>
