<!doctype html>
<html>
  <head>
    <title>Drag and Drop Network Composition</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link rel="stylesheet" type="text/css" href="css/dc.graph.css" />
    <link rel="stylesheet" type="text/css" href="css/dc.css" />
    <link rel="stylesheet" href="css/jquery-ui.css" />
    <link rel="stylesheet" href="css/jqueryui-editable.css" />
    <link rel="stylesheet" type="text/css" href="css/drag-drop-composition.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.css"
    />

    <script type="importmap">
      {
        "imports": {
          "d3": "https://cdn.jsdelivr.net/npm/d3@5.16.0/+esm",
          "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@1.4.2/+esm",
          "d3-color": "https://cdn.jsdelivr.net/npm/d3-color@1.4.1/+esm",
          "d3-scale": "https://cdn.jsdelivr.net/npm/d3-scale@2.2.2/+esm",
          "d3-dispatch": "https://cdn.jsdelivr.net/npm/d3-dispatch@1.0.6/+esm",
          "d3-array": "https://cdn.jsdelivr.net/npm/d3-array@1.2.4/+esm",
          "d3-collection": "https://cdn.jsdelivr.net/npm/d3-collection@1.0.7/+esm",
          "d3-interpolate": "https://cdn.jsdelivr.net/npm/d3-interpolate@1.4.0/+esm",
          "d3-ease": "https://cdn.jsdelivr.net/npm/d3-ease@1.0.7/+esm",
          "d3-transition": "https://cdn.jsdelivr.net/npm/d3-transition@1.3.2/+esm",
          "d3-zoom": "https://cdn.jsdelivr.net/npm/d3-zoom@1.8.3/+esm",
          "d3-drag": "https://cdn.jsdelivr.net/npm/d3-drag@1.2.5/+esm",
          "d3-fetch": "https://cdn.jsdelivr.net/npm/d3-fetch@1.2.0/+esm",
          "d3-queue": "https://cdn.jsdelivr.net/npm/d3-queue@3.0.7/+esm",
          "tippy.js": "https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/+esm",
          "dc": "https://cdn.jsdelivr.net/npm/dc@4.0.5/+esm",
          "crossfilter2": "https://cdn.jsdelivr.net/npm/crossfilter2@1.5.4/+esm",
          "@dagrejs/dagre": "https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.5/+esm",
          "@dagrejs/graphlib-dot": "https://cdn.jsdelivr.net/npm/@dagrejs/graphlib-dot@1.0.2/+esm",
          "querystring": "./js/querystring.js"
        }
      }
    </script>

    <!-- Setup global d3 for libraries that expect it -->
    <script type="module">
      import * as d3 from 'd3';
      window.d3 = d3;
    </script>

    <script type="text/javascript" src="js/lodash.js"></script>
    <script type="text/javascript" src="js/jquery.js"></script>
    <script type="text/javascript" src="js/jquery-ui.js"></script>
    <script type="text/javascript" src="js/jqueryui-editable.js"></script>
    <script type="text/javascript" src="js/promise-polyfill.js"></script>
    <script type="text/javascript" src="js/classlist-polyfill.js"></script>

    <script type="text/javascript" src="js/dagre.js"></script>
    <script type="text/javascript" src="js/cola.js"></script>
    <script type="module" src="js/parse-incrface.js"></script>
    <script type="module" src="js/dynagraph-main.js"></script>

    <script type="text/javascript" src="js/chart.registry.js"></script>
  </head>

  <body>
    <div id="main">
      <script type="module" src="js/example-header.js"></script>
      <div id="content">
        <div id="canvas-panel">
          <div id="canvas"></div>
        </div>
        <div id="right-panel">
          <div id="naming">
            <div>
              <a
                href="#"
                id="solution-name"
                data-type="text"
                data-pk="1"
                data-title="Enter solution name"
              ></a>
            </div>
            <div>
              <a
                href="#"
                id="description"
                data-type="text"
                data-pk="1"
                data-title="Enter description"
              ></a>
            </div>
          </div>
          <div id="commands">
            <div id="command-buttons">
              <a href="#" id="new-button" title="new solution"><i class="fa fa-plus"></i></a>
              &nbsp;&nbsp;&nbsp;&nbsp;
              <a href="#" id="save-button" class="button-disabled" title="solution is unchanged">
                <i class="fa fa-save"></i>
              </a>
              &nbsp;&nbsp;&nbsp;&nbsp;
              <a href="#" id="delete-button" class="button-disabled" title="delete solution">
                <i class="fa fa-remove"></i>
              </a>
            </div>
          </div>
          <div id="palette" role="tablist" aria-multiselectable="true"></div>
          <div id="properties">
            <div id="properties-content">
              <h4 id="selected-name"></h4>
              <table id="properties-table" class="table">
                <thead>
                  <tr>
                    <th>Property</th>
                    <th>Value</th>
                  </tr>
                </thead>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="js/bootstrap.js"></script>
    <script type="module" src="js/drag-drop-composition.js"></script>
  </body>
</html>
