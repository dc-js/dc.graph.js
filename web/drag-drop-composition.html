<!DOCTYPE html>
<html>
  <head>
    <title>Drag and Drop Network Composition</title>
    <meta charset="UTF-8">
    <link rel="icon" href="img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
    <link rel="stylesheet" type="text/css" href="css/dc.graph.css"/>
    <link rel="stylesheet" type="text/css" href="css/dc.css"/>

    <link rel="stylesheet" type="text/css" href="css/drag-drop-composition.css"/>
    <link rel="stylesheet" type="text/css" href="css/d3-tip.css"/>

  <script type="importmap">
  {
    "imports": {
      "d3": "https://cdn.jsdelivr.net/npm/d3@5.16.0/+esm",
      "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@1.4.2/+esm",
      "d3-color": "https://cdn.jsdelivr.net/npm/d3-color@1.4.1/+esm",
      "d3-scale": "https://cdn.jsdelivr.net/npm/d3-scale@2.2.2/+esm",
      "d3-dispatch": "https://cdn.jsdelivr.net/npm/d3-dispatch@1.0.6/+esm",
      "d3-array": "https://cdn.jsdelivr.net/npm/d3-array@1.2.4/+esm",
      "d3-collection": "https://cdn.jsdelivr.net/npm/d3-collection@1.0.7/+esm",
      "d3-interpolate": "https://cdn.jsdelivr.net/npm/d3-interpolate@1.4.0/+esm",
      "d3-ease": "https://cdn.jsdelivr.net/npm/d3-ease@1.0.7/+esm",
      "d3-transition": "https://cdn.jsdelivr.net/npm/d3-transition@1.3.2/+esm",
      "d3-zoom": "https://cdn.jsdelivr.net/npm/d3-zoom@1.8.3/+esm",
      "d3-drag": "https://cdn.jsdelivr.net/npm/d3-drag@1.2.5/+esm",
      "d3-fetch": "https://cdn.jsdelivr.net/npm/d3-fetch@1.2.0/+esm",
      "d3-queue": "https://cdn.jsdelivr.net/npm/d3-queue@3.0.7/+esm",
      "dc": "https://cdn.jsdelivr.net/npm/dc@4.0.5/+esm",
      "crossfilter2": "https://cdn.jsdelivr.net/npm/crossfilter2@1.5.4/+esm",
      "querystring": "./js/querystring.js"
    }
  }
  </script>

  <!-- Make d3 available globally for webcola and d3-tip -->
  <script type="module">
  import * as d3 from 'd3';
  window.d3 = d3;
  
  // Try a more reliable CDN for d3-tip
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/d3-tip@0.9.1/dist/d3-tip.min.js';
  script.onload = () => {
    console.log('d3-tip loaded, d3.tip:', window.d3.tip);
    // If d3.tip is still not available, manually create it
    if (!window.d3.tip && window.d3Tip) {
      window.d3.tip = window.d3Tip;
      console.log('Manually assigned d3.tip from d3Tip global');
    }
  };
  script.onerror = (e) => {
    console.error('Failed to load d3-tip.js from jsdelivr, trying fallback');
    // Fallback to cdnjs
    const fallbackScript = document.createElement('script');
    fallbackScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/d3-tip/0.7.1/d3-tip.min.js';
    fallbackScript.onload = () => {
      console.log('d3-tip fallback loaded, d3.tip:', window.d3.tip);
      if (!window.d3.tip && window.d3Tip) {
        window.d3.tip = window.d3Tip;
        console.log('Manually assigned d3.tip from fallback d3Tip global');
      }
    };
    fallbackScript.onerror = () => console.error('Fallback d3-tip also failed to load');
    document.head.appendChild(fallbackScript);
  };
  document.head.appendChild(script);
  </script>

    <script type="text/javascript" src="js/lodash.js"></script>
    <script type="text/javascript" src="js/jquery.js"></script>
    <script type="text/javascript" src="js/jquery-ui.js"></script>

    <script type="text/javascript" src="js/cola.js"></script>
    <script type="text/javascript" src="js/dynagraph-wasm.js"></script>
    <script type="module" src="js/parse-incrface.js"></script>

    <script type="text/javascript" src="js/chart.registry.js"></script>

<body>
