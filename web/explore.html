<!doctype html>
<html>
  <head>
    <title>Explore a large graph</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="css/explore.css" />
    <link rel="stylesheet" type="text/css" href="css/dc.graph.css" />
    <link rel="stylesheet" type="text/css" href="css/graph-controls.css" />
    <link rel="stylesheet" type="text/css" href="css/graph-error.css" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <script type="importmap">
      {
        "imports": {
          "@dagrejs/dagre": "https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.5/+esm",
          "@dagrejs/graphlib-dot": "https://cdn.jsdelivr.net/npm/@dagrejs/graphlib-dot@1.0.2/+esm",
          "@viz-js/viz": "https://cdn.jsdelivr.net/npm/@viz-js/viz@3.16.0/+esm",
          "crossfilter2": "https://cdn.jsdelivr.net/npm/crossfilter2@1.5.4/+esm",
          "d3": "https://cdn.jsdelivr.net/npm/d3@5.16.0/+esm",
          "d3-array": "https://cdn.jsdelivr.net/npm/d3-array@1.2.4/+esm",
          "d3-brush": "https://cdn.jsdelivr.net/npm/d3-brush@1.1.6/+esm",
          "d3-collection": "https://cdn.jsdelivr.net/npm/d3-collection@1.0.7/+esm",
          "d3-color": "https://cdn.jsdelivr.net/npm/d3-color@1.4.1/+esm",
          "d3-dispatch": "https://cdn.jsdelivr.net/npm/d3-dispatch@1.0.6/+esm",
          "d3-drag": "https://cdn.jsdelivr.net/npm/d3-drag@1.2.5/+esm",
          "d3-ease": "https://cdn.jsdelivr.net/npm/d3-ease@1.0.7/+esm",
          "d3-fetch": "https://cdn.jsdelivr.net/npm/d3-fetch@1.2.0/+esm",
          "d3-format": "https://cdn.jsdelivr.net/npm/d3-format@1.4.5/+esm",
          "d3-interpolate": "https://cdn.jsdelivr.net/npm/d3-interpolate@1.4.0/+esm",
          "d3-path": "https://cdn.jsdelivr.net/npm/d3-path@1.0.9/+esm",
          "d3-queue": "https://cdn.jsdelivr.net/npm/d3-queue@3.0.7/+esm",
          "d3-scale": "https://cdn.jsdelivr.net/npm/d3-scale@2.2.2/+esm",
          "d3-scale-chromatic": "https://cdn.jsdelivr.net/npm/d3-scale-chromatic@1.5.0/+esm",
          "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@1.4.2/+esm",
          "d3-shape": "https://cdn.jsdelivr.net/npm/d3-shape@1.3.7/+esm",
          "d3-time": "https://cdn.jsdelivr.net/npm/d3-time@1.1.0/+esm",
          "d3-time-format": "https://cdn.jsdelivr.net/npm/d3-time-format@2.3.0/+esm",
          "d3-timer": "https://cdn.jsdelivr.net/npm/d3-timer@1.0.10/+esm",
          "d3-transition": "https://cdn.jsdelivr.net/npm/d3-transition@1.3.2/+esm",
          "d3-zoom": "https://cdn.jsdelivr.net/npm/d3-zoom@1.8.3/+esm",
          "dagre": "https://cdn.jsdelivr.net/npm/dagre@0.8.5/+esm",
          "dc": "https://cdn.jsdelivr.net/npm/dc@4.0.5/+esm",
          "interval-tree-1d": "https://cdn.jsdelivr.net/npm/interval-tree-1d@latest/+esm",
          "lodash": "https://cdn.jsdelivr.net/npm/lodash@4.17.21/+esm",
          "metagraph": "https://cdn.jsdelivr.net/npm/metagraph@0.1.0/+esm",
          "querystring": "./js/querystring.js",
          "tippy.js": "https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/+esm",
          "webcola": "https://cdn.jsdelivr.net/npm/webcola@3.4.0/+esm",
          "yoga-layout": "https://cdn.jsdelivr.net/npm/yoga-layout@1.10.0/+esm"
        }
      }
    </script>

    <!-- Set up global d3 for legacy scripts (synchronous) -->
    <script src="https://cdn.jsdelivr.net/npm/d3@5.16.0/dist/d3.min.js"></script>

    <script type="text/javascript" src="js/chart.registry.js"></script>
    <script type="text/javascript" src="js/viz.js"></script>
    <script type="module" src="js/parse-incrface.js"></script>
    <script type="module" src="js/dynagraph-main.js"></script>

    <script type="module" src="js/graph-error.js"></script>
    <script type="text/javascript" src="js/jquery.js"></script>
    <script type="module" src="js/querystring.js"></script>
    <script type="module" src="js/sync-url-options.js"></script>
    <script type="module" src="js/dc.graph.tracker.domain.js"></script>
  </head>

  <body>
    <div id="main">
      <script type="module" src="js/example-header.js"></script>
      <div id="controls">
        <div id="left-controls">
          <label for="#add-node">Add node&nbsp;</label>
          <select id="add-node"></select>
          &nbsp;&nbsp;
          <label for="#expand">Expand&nbsp;</label>
          <select id="expand">
            <option value="out">out</option>
            <option value="in">in</option>
            <option value="both">both</option>
            <option value="all-out">all out</option>
            <option value="all-in">all in</option>
          </select>
          &nbsp;&nbsp;
          <button id="reset" class="btn-xs btn-default">reset</button>
          &nbsp;&nbsp;
          <select id="layout"></select>
        </div>
        <div id="middle-controls"></div>
        <div id="right-controls">
          <label for="#user-file" title="in-browser: nothing uploaded to server">
            Load file&nbsp;
          </label>
          <input
            type="file"
            id="user-file"
            style="display: inline"
            title="in-browser: nothing uploaded to server"
          />
          <a id="data-link" target="dcgraph-datalink" style="font-size: 8px" href="#">DATA LINK</a>
        </div>
      </div>
      <div id="graph">
        <div id="numerics"></div>
      </div>
    </div>
    <div id="message" style="display: none"></div>

    <script type="module" src="js/explore.js"></script>
  </body>
</html>
