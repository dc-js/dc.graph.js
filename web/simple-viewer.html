<!DOCTYPE html>
<html>
<head>
  <title>Simple graph viewer</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="css/dc.graph.css"/>
  <link rel="stylesheet" type="text/css" href="css/graph-controls.css"/>
  <link rel="stylesheet" type="text/css" href="css/graph-error.css"/>
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
  <link rel="stylesheet" type="text/css" href="css/d3-tip.css"/>
  <link rel="stylesheet" type="text/css" href="css/example-common.css"/>

  <script type="importmap">
  {
    "imports": {
      "d3": "https://cdn.jsdelivr.net/npm/d3@5.16.0/+esm",
      "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@1.4.2/+esm",
      "d3-scale": "https://cdn.jsdelivr.net/npm/d3-scale@2.2.2/+esm",
      "d3-collection": "https://cdn.jsdelivr.net/npm/d3-collection@1.0.7/+esm",
      "d3-array": "https://cdn.jsdelivr.net/npm/d3-array@1.2.4/+esm",
      "d3-fetch": "https://cdn.jsdelivr.net/npm/d3-fetch@1.2.0/+esm",
      "d3-dispatch": "https://cdn.jsdelivr.net/npm/d3-dispatch@1.0.6/+esm",
      "d3-timer": "https://cdn.jsdelivr.net/npm/d3-timer@1.0.10/+esm",
      "d3-transition": "https://cdn.jsdelivr.net/npm/d3-transition@1.3.2/+esm",
      "d3-zoom": "https://cdn.jsdelivr.net/npm/d3-zoom@1.8.3/+esm",
      "d3-brush": "https://cdn.jsdelivr.net/npm/d3-brush@1.1.6/+esm",
      "d3-shape": "https://cdn.jsdelivr.net/npm/d3-shape@1.3.7/+esm",
      "d3-ease": "https://cdn.jsdelivr.net/npm/d3-ease@1.0.7/+esm",
      "dc": "https://cdn.jsdelivr.net/npm/dc@4.2.7/+esm",
      "crossfilter2": "https://cdn.jsdelivr.net/npm/crossfilter2@1.5.4/+esm",
      "querystring": "./js/querystring.js"
    }
  }
  </script>

  <!-- Setup global d3 for libraries that expect it -->
  <script type="module">
    import * as d3 from 'd3';
    window.d3 = d3;
  </script>

  <script type="text/javascript" src="js/jquery.js"></script>
  <script type="text/javascript" src="js/lodash.js"></script>
  <script type="text/javascript" src="js/promise-polyfill.js"></script>

  <script type="text/javascript" src="js/cola.js"></script>
  <script type="text/javascript" src="js/dagre.js"></script>
  <script type="text/javascript" src="js/d3v4-force.js"></script>
  <script type="text/javascript" src="js/viz.js"></script>
  <script type="text/javascript" src="js/dynagraph-wasm.js"></script>
  <script type="module" src="js/parse-incrface.js"></script>
  <script type="text/javascript" src="js/chart.registry.js"></script>
  <script type="module" src="js/graph-error.js"></script>

  <script type="text/javascript" src="js/graphlib-dot.js"></script>



  <style type="text/css">
    body {
        overflow: hidden;
    }
    #main {
        position: absolute;
        left: 0; top: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
    }
    #graph {
        flex: 1;
    }
  </style>

</head>


<body>

  <div id="main">
    <script type="module" src="js/example-header.js"></script>
    <div id="controls">
      <div id="left-controls">
        <select id="layout"></select>&nbsp;&nbsp;&nbsp;
        <div id="cutoff-stuff" style="display: none"><label for="cutoff">&nbsp;Edge cutoff:&nbsp;</label><div style="display: inline-block"><input id="cutoff" type="range" min="0" max="1" step="0.05" style="width: 10em"></div>&nbsp;<span id="cutoff-display"></span>&nbsp;&nbsp;&nbsp;</div>
        <input id="graphviz-attrs" type="checkbox"><label for="graphviz-attrs">&nbsp;Use graphviz <a href="https://graphviz.org/doc/info/attrs.html" target=_blank>attrs</a></label>
      </div>
      <div id="middle-controls"></div>
      <div id="right-controls">
        <label for='#user-file' title="in-browser: nothing uploaded to server">Load file&nbsp;</label><input type="file" id="user-file" style="display: inline" title="in-browser: nothing uploaded to server">
        <a id="data-link" target="dcgraph-datalink" style="font-size: 8px; visibility: hidden" href='#'>DATA LINK</a>
      </div>
    </div>
    <div id="graph" class="chart"></div>
  </div>
  <div id="message" style="display: none;"></div>

  <script type="module" src="js/simple-viewer.js"></script>
</body>
